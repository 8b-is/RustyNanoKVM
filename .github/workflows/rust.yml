name: Rust CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
      
      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          # RISC-V cross-compilation would need additional setup
          # - target: riscv64gc-unknown-linux-musl
          #   name: riscv64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$BUILD_TARGET"
          rustup default stable
      
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanokvm-server-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/nanokvm-server

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build --file ./docker/Dockerfile.rust --tag nanokvm-server:latest .
